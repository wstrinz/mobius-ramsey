name = "MobiusRamsey"
version = "1.0.0"
defaultTargets = ["OAI", "MobiusRamsey", "Challenge", "Solution"]

# OpenAI's EuclideanRamsey package sets autoImplicit = false; so does this one.
leanOptions = { autoImplicit = false }

# Pinned to a full commit SHA: Mathlib tag v4.35.0-rc2 (the PalomarTemplate pin).
[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "065356127b1dc0016f66b7283ce0ce2c4055aa55"

# The 28-module import closure of OpenAI's EuclideanRamsey `Main`, ported to the module system
# (Apache-2.0; derived from openai/math fd4aeeb2; see NOTICE and docs/PORT-LOG.md).
[[lean_lib]]
name = "OAI"
globs = ["OAI.Combinatorics.EuclideanRamsey.+"]

# Theorem C (Möbius invariance of the Ramsey property), its corollaries, and their support.
[[lean_lib]]
name = "MobiusRamsey"
globs = ["MobiusRamsey.+"]

[[lean_lib]]
name = "Challenge"
roots = ["Challenge"]

[[lean_lib]]
name = "Solution"
roots = ["Solution"]
