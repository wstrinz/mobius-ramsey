fidelity:
  divergences: >-
    Ramsey, Congruent and Space are OpenAI's definitions, verbatim. A Möbius
    transformation of S^{d-1} is modelled as mobiusMap L for a real matrix L with
    L^T S L = S, acting on the null lines of S; for d >= 2 the identification
    with the Möbius group is classical and not formalized (for d = 1 boosts act
    trivially on S^0, so phi_L is not a faithful model of a Möbius group there;
    the theorem still holds). mobiusMap divides by the time coordinate, which is
    nonzero on the sphere (proved); off the sphere the map is not meaningful,
    and the theorems only evaluate it on the sphere. Points are an injective
    family on the unit sphere centred at 0; the note's statement for an
    arbitrary sphere reduces to this by a similarity, by hand. The circle
    corollaries use circ(t) = ((1 - t^2)/(1 + t^2), 2t/(1 + t^2)), the chart from
    the pole (-1, 0). Nine lines of non-Mathlib, non-OpenAI definitions in total
    (lorentzForm, aug, mobiusMap, circ). Item-by-item table: docs/FIDELITY.md.

review:
  status: "self-assessed"
  reviewers:
    - "Will Strinz (owner's read of the hand proof of Theorem C; not expert review)"
  notes: >-
    Statements audited by the Claude agents that wrote them, and checked by lake
    comparator against a Mathlib-only Challenge.lean, with five negative controls
    refused (sorry, redefined Ramsey, redefined lorentzForm, redefined circ,
    Theorem C without injectivity). The hand proof was checked step by step by a
    Claude agent. A Claude Opus 5.5 agent that did not build the package
    reviewed the fidelity of the statements (faithful; its fixes to prose,
    metadata and credit wording were applied), and a Claude Sonnet 5.5 agent
    reproduced the package from README.md and REPRODUCE.md alone. Item-by-item
    fidelity table: docs/FIDELITY.md. No independent human expert review.

alignment:
  namespace: "OAI.EuclideanRamsey.Mobius"
  statements:
    - source: "note/mobius.tex, Theorem C"
      lean: "OAI.EuclideanRamsey.Mobius.ramsey_iff_ramsey_mobius_full"
      module: "MobiusRamsey.Theorem"
      status: "proved"
      note: "Unit sphere and phi_L, L in O(1,d); arbitrary spheres by a similarity (hand)."
    - source: "note/mobius.tex, Corollary 1(c)"
      lean: "OAI.EuclideanRamsey.Mobius.ramsey_mobius_of_algebraic"
      module: "MobiusRamsey.Corollaries"
      status: "proved (unit-sphere form)"
      note: "The note's statement for an arbitrary sphere and for regular polygons follows by hand."
    - source: "note/mobius.tex, Corollary 1(d)"
      lean: "OAI.EuclideanRamsey.Mobius.ramsey_circ_mul_rat, OAI.EuclideanRamsey.Mobius.ramsey_circ_add_rat"
      module: "MobiusRamsey.Corollaries"
      status: "proved"
      note: "Rational t_i; ramsey_circ_mul and ramsey_circ_add allow algebraic t_i."

