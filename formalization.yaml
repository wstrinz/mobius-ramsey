status:
  scope: >-
    Formalized: Theorem C for finitely many distinct points of the unit sphere
    centred at 0 in R^d and Möbius maps given as phi_L with L in O(1,d), with no
    spanning hypothesis (ramsey_iff_ramsey_mobius_full); Möbius images of
    algebraic unit-sphere sets are Ramsey (ramsey_mobius_of_algebraic); the
    circ(k t_i) and circ(t_i + c) families (ramsey_circ_mul_rat,
    ramsey_circ_add_rat; algebraic t_i in ramsey_circ_mul, ramsey_circ_add).
    Not formalized: that for d >= 2 the maps phi_L are exactly the Möbius
    transformations of the sphere (the classical isomorphism PO(1,d) =
    Möb(S^{d-1}), cited; for d = 1 it fails, see docs/FIDELITY.md); the
    reduction from an arbitrary sphere to the unit sphere by a similarity; the
    cross-ratio and triangle corollaries of the note.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]
  main_results:
    - declaration: "OAI.EuclideanRamsey.Mobius.ramsey_iff_ramsey_mobius_full"
      file: "MobiusRamsey/Theorem.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator.json"
      literature_dependencies:
        - statement: "For d >= 2, the maps mobiusMap L, L in O(1,d), are the Möbius transformations of the unit sphere (PO(1,d) = Möb(S^{d-1})). For d = 1 the identification fails (boosts act trivially on S^0); the theorem holds there but is not about a Möbius group."
          source: "classical; cited in note/mobius.tex §2: Ratcliffe, Foundations of Hyperbolic Manifolds, 3rd ed. (GTM 149, 2019), Thm. 3.2.3 and §3.2 Cor. 3, §4.4 Cor. 3, Thm. 4.5.2 and §4.5 Cor. 1; Beardon, The Geometry of Discrete Groups (GTM 91, 1983), §3.7, Thms. 3.7.5-3.7.6, pp. 49-54 (docs/CITATION-SOURCES.md)"
    - declaration: "OAI.EuclideanRamsey.Mobius.ramsey_mobius_of_algebraic"
      file: "MobiusRamsey/Corollaries.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator.json"
    - declaration: "OAI.EuclideanRamsey.Mobius.ramsey_circ_mul_rat"
      file: "MobiusRamsey/Corollaries.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator.json"
    - declaration: "OAI.EuclideanRamsey.Mobius.ramsey_circ_add_rat"
      file: "MobiusRamsey/Corollaries.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator.json"

