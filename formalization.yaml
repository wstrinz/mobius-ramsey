    type: original-proof
    authors:
      - "Will Strinz"
    location: "note/mobius.tex, Theorem C and Corollary 1"
    relationship: other
    note: >-
      Theorem C is presented in this repository and its accompanying note; no
      prior statement was found (docs/PRIOR-WORK-SEARCH.md). Pálvölgyi's
      arXiv:2609.23327, Lemma A.5, proves invariance of his derivation
      certificates and states that it does not assert Möbius invariance of the
      Ramsey property itself.
    author_endorsement: "n/a"
  - title: "A classification of finite Euclidean Ramsey configurations (OpenAI math release, result 172)"
    authors:
      - "OpenAI"
    id: "https://github.com/openai/math/tree/fd4aeeb2ee4fc729c18d98444fed42fd0529eeeb"
    type: "preprint and Lean formalization"
    location: "preprints/A-classification-of-finite-Euclidean-Ramsey-configurations-September-23-2026/ (Theorem 1.1, Proposition 2.1); lean/OAI/Combinatorics/EuclideanRamsey/ (Main.lean import closure)"
    relationship: other
    note: >-
      The foundation. Theorem C is a short consequence of the classification, and
      its Lean proof imports OpenAI's Lean proof (necessity ramsey_realCriterion,
      descent realCriterion_fieldCriterion, sufficiency fieldCriterion_ramsey),
      whose 28 files are included, ported to the module system by header-only
      changes (docs/PORT-LOG.md). The definitions Space, Congruent and Ramsey are
      OpenAI's, verbatim. This work trusts OpenAI's Lean proof, which is replayed
      by the kernels here.
    license: "Apache-2.0"
    author_endorsement: "not-contacted"
  - title: "A cyclic non-Ramsey heptagon"
    authors:
      - "Dömötör Pálvölgyi"
    id: "arXiv:2609.23327"
    type: "article"
    location: "Appendix, Lemma A.5"
    relationship: background
    note: "Nearest prior statement: Möbius invariance of derivation certificates, with an explicit disclaimer that it does not assert Möbius invariance of the Ramsey property."
    author_endorsement: "not-contacted"
  - title: "Spherical sets with algebraic coordinates are Ramsey (Theorem A, used for the corollaries)"
    authors:
      - "JD-Jones-ASES"
      - "Rogerhu12"
      - "atimics"
    id: "https://github.com/JD-Jones-ASES/six-concyclic-lean; https://github.com/Rogerhu12/openai-math-extensions; https://github.com/atimics/math2"
    type: "repositories (Lean and TeX)"
    location: "six-concyclic-lean root commit 0703d7d; openai-math-extensions commit f8a2bb2, papers/172-euclidean-ramsey/algebraic_spherical_configurations.tex; math2 commit 8ab51fa, EndToEnd/AlgebraicRamsey.lean"
    relationship: background
    note: >-
      Prior statements and proofs of Theorem A: criterion level in Lean (Ramsey
      conclusion conditional on hsuff), in TeX, and end to end in Lean for
      algebraic configurations with full affine span (atimics; its written
      derivation also covers sets similar to algebraic ones). This
      repository's ramsey_of_algebraic is a further Lean proof on OpenAI's
      development, not a first one; no code was copied.
    author_endorsement: "not-contacted"

