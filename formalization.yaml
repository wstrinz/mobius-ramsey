      tool_setup: "Read-only agents for the prior-work searches (arXiv API, GitHub, the Palomar registry, MathOverflow), for a fresh reproduction of an earlier build, and for a fresh reproduction of this package from README.md and REPRODUCE.md."
    - method: "other"
