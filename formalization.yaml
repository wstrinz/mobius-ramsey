# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "Möbius invariance of the Ramsey property for finite spherical sets"
  description: >-
    Theorem C: for finitely many distinct points a of the unit sphere of R^d and
    any L in O(1,d) (L^T S L = S with S = diag(-1, 1, ..., 1)), the configuration
    a is Euclidean Ramsey if and only if its image under the Möbius map phi_L is
    Euclidean Ramsey. There is no affine-spanning hypothesis. Ramsey is OpenAI's
    definition from result 172 (for every r >= 2 there is D such that every
    r-colouring of R^D contains a monochromatic congruent copy). Corollaries,
    also proved: every Möbius image of a finite set of distinct unit-sphere
    points with real algebraic coordinates is Ramsey; and for distinct rationals
    t_i and arbitrary reals k != 0 and c, the circle points circ(k t_i) and
    circ(t_i + c) form Ramsey sets, where circ is the stereographic chart of the
    unit circle. The proof builds on OpenAI's complete Lean proof of the
    classification of finite Euclidean Ramsey configurations (openai/math
    fd4aeeb2, result 172), whose 28 files are included with header-only changes
    for the Lean module system. The Lorentz matrix transports OpenAI's real
    tensor criterion; OpenAI's descent and sufficiency conclude. All theorems
    depend on propext, Classical.choice and Quot.sound only.
  authors:
    - "Will Strinz"
  license: "MIT"
  responsible_maintainers:
    - "Will Strinz"

classification:
  arxiv: ["math.CO", "math.MG"]
  msc2020: ["05D10", "52C10", "51B10"]

